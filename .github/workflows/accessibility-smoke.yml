name: G-11 Accessibility smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/accessibility-smoke.test.mjs'
      - '.github/workflows/accessibility-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static accessibility/privacy contracts (no external APIs)
        run: node --test tests/accessibility-smoke.test.mjs
